# AI Video Editing Toolkit - integration catalogue (machine-readable, read by install/bootstrap.py and doctor).
# Every MCP / CLI / API / plugin / model the toolkit can use. Human view: integrations/README.md and docs/{en,he}/integrations.md.
#
# Rules encoded here (src: blueprint MCP_PROFILES s2/s4/s7, SECURITY_AND_LICENSING s6, COST_MODEL s7; 2026-10-02):
#  * NO secret ever lives in this file - only the NAME of an environment variable (api.env_var / mcp.env_var).
#  * "cost" = free | free-tier | paid. Anything that can generate paid output goes through the paid-spend-gate skill.
#  * status = "verified" means the command/URL was read on an official page on `checked`; otherwise "unverified" and the
#    bootstrap prints the command but does not rely on it. confidence = high | medium | low.
#  * profiles: core (always) | minimal | standard | pro | optional.  addons: opt-in names for `bootstrap.py add <id|addon>` (also accepted by --with).
#  * Never turn this catalogue into a startup profile: Minimal = no MCP servers (blueprint MCP_PROFILES s2).
schema = 1

[meta]
checked_at = "2026-10-02"
note = "Perishable. Versions/URLs/prices are re-checked before each release (non-spending refresh: read the source URLs below; never call a paid API)."
research_pins = "HyperFrames 0.8.98 (research pin, distilled 04 2026-10-01); Playwright MCP 0.0.83 (E06 pin)"

# ----------------------------------------------------------------------------- profiles (documentation; selection logic is in bootstrap.py)
[profiles.minimal]
title = "Minimal (default)"
mcp = []
summary = "Core only: skills + FFmpeg + the toolkit's own tools. No MCP server is registered. Needs no account, key, GPU or payment."

[profiles.standard]
title = "Standard"
mcp = ["playwright"]
summary = "Minimal + ONE isolated browser server for reference inspection and local preview QA."

[profiles.pro]
title = "Pro"
mcp = ["playwright"]
summary = "Same as Standard; providers are added one at a time later with `bootstrap.py add <id>` (nothing is registered until the student asks)."

