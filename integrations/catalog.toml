# ============================================================================= MCP: Standard profile
[[entry]]
id = "playwright"
kind = "mcp"
name = "Playwright MCP (Microsoft), isolated"
role = "reference capture and local preview QA of HTML compositions in an isolated browser"
profiles = ["standard"]
cost = "free"
license = "Apache-2.0"
security = "run --isolated --headless with an explicit --output-dir; origin filters are NOT a security boundary; never attach the signed-in browser profile; one browser server only"
overhead = "25 tools = 21,382 B tools/list (E06, the reference machine, pinned 0.0.83); bytes are not tokens"
doctor = { smoke = "client `mcp get avc-playwright`, then one browser_navigate to a local fixture page + browser_snapshot + browser_close", failure_control = "navigate to a closed port must return an error, not a pass" }
  [entry.mcp]
  name = "avc-playwright"
  existing_names = ["playwright"]
  transport = "stdio"
  command = "npx"
  args = ["@playwright/mcp@0.0.83", "--isolated", "--headless", "--output-dir", "{browser_out}"]
  auth = "none"
  register = "auto"
  codex_auto = true
  status = "verified"
  source = "https://github.com/microsoft/playwright-mcp (README) ; https://registry.npmjs.org/@playwright/mcp/latest (0.0.83 = latest on 2026-10-02)"
  checked = "2026-10-02"
  confidence = "high"
  by_hand = "If the browser is missing the server says so: let the student approve its browser install, or add `--browser msedge` / use the installed Chrome."
  [entry.install.windows]
  command = "claude mcp add --scope user --transport stdio avc-playwright -- cmd /c npx @playwright/mcp@0.0.83 --isolated --headless --output-dir <WORK_ROOT>/browser-output"
  status = "verified"
  source = "https://code.claude.com/docs/en/mcp (Windows cmd /c wrapper) ; https://github.com/microsoft/playwright-mcp"
