# Deterministic CPU lane: runs on every push and pull request. No secrets, no model calls, no paid actions.
# Policy (REPO_ARCHITECTURE section 11, SECURITY_AND_LICENSING section 6): actions pinned to reviewed commits,
# least-privilege token, untrusted changes never meet credentials. scripts/check_workflows.py enforces this file.
#
# PINS: actions are pinned to full commit SHAs resolved on 2026-10-02 (checkout v7.0.1, setup-python v7.0.0). Re-review before bumping.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  deterministic:
    name: deterministic gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install FFmpeg (installed on the runner, never bundled in the repository)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -y && sudo apt-get install -y ffmpeg
          elif [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg
          else choco install ffmpeg -y --no-progress; fi
          ffmpeg -version | head -1

      - name: Install Python test dependencies (the gate scripts are stdlib-only; the tools need numpy, Pillow, OpenCV)
        run: python -m pip install --disable-pip-version-check "pytest>=8,<10" "numpy>=2.0" "Pillow>=10.1" opencv-python-headless jsonschema

      - name: Deterministic gates (skills, scans, BOM, parity, docs, workflows, eval data)
        # The client-name denylist is a LOCAL file and is absent here: scan_private reports NOT_RUN for that part,
        # which this table shows explicitly. Release builds (--final) require it.
        run: python scripts/run_all_checks.py

      - name: Unit tests
        run: python -m pytest tests/unit -q -p no:cacheprovider

      - name: HyperFrames pin installs from its official package (nothing of it is stored in the repository)
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "const v=require('./node_modules/hyperframes/package.json').version; console.log('hyperframes', v); if (v !== '0.8.98') process.exit(1)"

      # The media tests (synthetic E04 fixtures, Hebrew/emoji paths) run for real now that FFmpeg is installed. Keep this lane deterministic and free.
