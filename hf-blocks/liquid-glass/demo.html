<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #ffffff; }
    </style>
  </head>
  <body>
    <div id="demo-root" data-composition-id="demo" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="demo-bg" style="position:absolute;inset:0;background:repeating-linear-gradient(90deg,#111214 0 6px,#ffffff 6px 40px)"></div>
      <div data-layout-allow-overlap data-layout-allow-occlusion style="position:absolute;left:0;right:0;top:860px;text-align:center;font:700 120px/1 sans-serif;color:#111214">behind the glass</div>
      <div id="demo-liquid-glass" class="clip" data-composition-id="liquid-glass-host" data-composition-src="compositions/liquid-glass.html" data-start="0" data-duration="3" data-track-index="1"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["demo"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
