<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"text","type":"string","label":"Text inside the glass (typed on if type_on; empty = a bare glass panel)","default":"a horse"},
  {"id":"width","type":"number","label":"Glass width in px","default":720},
  {"id":"height","type":"number","label":"Glass height in px","default":132},
  {"id":"radius","type":"number","label":"Corner radius in px (height/2 = a pill)","default":66},
  {"id":"top","type":"number","label":"Top of the glass in px","default":894},
  {"id":"blur","type":"number","label":"Body frost: backdrop blur in px","default":14},
  {"id":"edge","type":"number","label":"Width of the refracting edge band in px","default":12},
  {"id":"magnify","type":"number","label":"How much the edge band magnifies what is behind (1.06 = thick glass)","default":1.06},
  {"id":"aura","type":"boolean","label":"Draw a slow pastel aura behind the glass (glass on plain white shows nothing)","default":true},
  {"id":"type_on","type":"boolean","label":"Type the text in, letter by letter","default":true},
  {"id":"type_at","type":"number","label":"Second the typing starts","default":0.5},
  {"id":"cps","type":"number","label":"Typing speed, characters per second","default":18},
  {"id":"rtl","type":"boolean","label":"Right-to-left text (on the text only)","default":false},
  {"id":"duration","type":"number","label":"Seconds the block lasts (must match the host data-duration)","default":3}
]'>
  <head>
    <meta charset="UTF-8" />
    <style>
      /* Liquid glass for a control (a prompt bar, a settings panel, a caption pill): the scene behind is frosted, a thin band along the
         edge bends it like thick glass (an SVG displacement map built once from a rounded-rectangle distance field), then milk, a top
         sheen, a bright rim and a soft lift shadow. Glass needs something behind it: the optional aura gives it a slow pastel wash.
         Palette from the page: --hfb-aura-a, --hfb-aura-b, --hfb-aura-c, --hfb-ink. Font: --hfb-font. Chromium (the renderer) draws
         backdrop-filter url(); other browsers show the frost without the bend. */
      #liquid-glass { position: absolute; inset: 0; overflow: hidden; font-family: var(--hfb-font, sans-serif); }
      #liquid-glass .lg-aura { position: absolute; left: 50%; width: 1500px; height: 900px; margin-left: -750px; border-radius: 50%; filter: blur(90px); opacity: 0;
        background: radial-gradient(closest-side at 30% 50%, var(--hfb-aura-a, #ffc2dc), transparent),
                    radial-gradient(closest-side at 70% 45%, var(--hfb-aura-b, #b9c8ff), transparent),
                    radial-gradient(closest-side at 50% 70%, var(--hfb-aura-c, #c6f3e6), transparent); }
      #liquid-glass .lg-glass, #liquid-glass .lg-edge, #liquid-glass .lg-frost { position: absolute; left: 50%; }
      #liquid-glass .lg-glass { background: rgba(255, 255, 255, 0.22);
        box-shadow: 0 22px 48px rgba(17, 18, 20, 0.12), 0 2px 6px rgba(17, 18, 20, 0.06), inset 0 0 0 1.5px rgba(255, 255, 255, 0.7), inset 0 1.5px 0 rgba(255, 255, 255, 0.95); }
      #liquid-glass .lg-sheen { position: absolute; left: 0; right: 0; top: 0; height: 48%; border-radius: inherit; pointer-events: none;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0)); }
      #liquid-glass .lg-text { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 44px; color: var(--hfb-ink, #111214); font-weight: 500; white-space: nowrap; }
      #liquid-glass .lg-ch { opacity: 0; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="liquid-glass" data-composition-id="liquid-glass" data-width="1080" data-height="1920">
      <svg width="0" height="0" style="position:absolute"><defs>
        <filter id="lg-refract" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
          <feImage id="lg-map" x="0" y="0" result="lgmap" preserveAspectRatio="none" />
          <feDisplacementMap id="lg-disp" in="SourceGraphic" in2="lgmap" xChannelSelector="R" yChannelSelector="G" scale="0" />
        </filter>
      </defs></svg>
      <div class="lg-aura" id="lg-aura" data-layout-allow-occlusion data-layout-allow-overflow></div>
      <div class="lg-frost" id="lg-frost"></div>
      <div class="lg-edge" id="lg-edge"></div>
      <div class="lg-glass" id="lg-glass" data-layout-allow-overlap><div class="lg-sheen"></div><div class="lg-text" id="lg-text" data-layout-allow-overlap></div></div>
      <script>
        (function () {
          var v = window.__hyperframes.getVariables();
          var D = Math.max(0.5, Number(v.duration) || 3);
          var W = Number(v.width) || 720, H = Number(v.height) || 132, R = Math.min(Number(v.radius) || 66, H / 2, W / 2);
          var TOP = Number(v.top) || 894, BLUR = Number(v.blur) || 14, EDGE = Number(v.edge) || 12, MAG = Number(v.magnify) || 1.06;
          var on = function (k, d) { return v[k] === undefined ? d : !(v[k] === false || v[k] === "false"); };
          var glass = document.getElementById("lg-glass"), edge = document.getElementById("lg-edge"), aura = document.getElementById("lg-aura");
          var frost = document.getElementById("lg-frost");
          [glass, edge].forEach(function (el) {
            el.style.width = W + "px"; el.style.height = H + "px"; el.style.marginLeft = (-W / 2) + "px"; el.style.top = TOP + "px"; el.style.borderRadius = R + "px";
          });
          // three layers: the frost INSIDE the edge band, the refracting ring on the band, then milk/rim/sheen/text on top (no filter)
          frost.style.width = (W - 2 * EDGE) + "px"; frost.style.height = (H - 2 * EDGE) + "px"; frost.style.marginLeft = (-W / 2 + EDGE) + "px";
          frost.style.top = (TOP + EDGE) + "px"; frost.style.borderRadius = Math.max(0, R - EDGE) + "px";
          frost.style.backdropFilter = "blur(" + BLUR + "px) saturate(1.25) brightness(1.06)";
          // the edge band: only an EDGE-px ring of this element is visible (mask), and it bends the scene behind it inward
          edge.style.backdropFilter = "url(#lg-refract) blur(1.2px) saturate(1.3) brightness(1.08)";
          var ring = "linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0)";
          edge.style.padding = EDGE + "px"; edge.style.boxSizing = "border-box";
          edge.style.webkitMask = ring; edge.style.webkitMaskComposite = "xor"; edge.style.mask = ring; edge.style.maskComposite = "exclude";
          // displacement map from a rounded-rect distance field: inside the edge band each pixel samples (MAG-1) toward the centre,
          // easing to zero at the inner side of the band; built ONCE (not time-dependent), so every frame stays a pure function of time
          var cv = document.createElement("canvas"); cv.width = W; cv.height = H;
          var ctx = cv.getContext("2d"), img = ctx.createImageData(W, H), maxD = 0, raw = new Float32Array(W * H * 2);
          for (var y = 0; y < H; y++) {
            for (var x = 0; x < W; x++) {
              var px = x - W / 2, py = y - H / 2;
              var qx = Math.abs(px) - (W / 2 - R), qy = Math.abs(py) - (H / 2 - R);
              var sd = Math.min(Math.max(qx, qy), 0) + Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) - R; // < 0 inside
              var t = Math.max(0, Math.min(1, 1 + sd / EDGE)); // 1 at the outer edge, 0 at the inner side of the band
              // the inward normal of the rounded rectangle at this pixel (the gradient of the distance field)
              var nx, ny;
              if (qx > 0 && qy > 0) { var L = Math.hypot(qx, qy); nx = qx / L; ny = qy / L; }
              else if (qx > qy) { nx = 1; ny = 0; } else { nx = 0; ny = 1; }
              nx *= px < 0 ? -1 : 1; ny *= py < 0 ? -1 : 1;
              // sample from up to ~EDGE*0.6 px inward at the outer edge (scaled so magnify 1.06 = the default bend): a lens rim
              var m = EDGE * 0.6 * ((MAG - 1) / 0.06) * t * t * (3 - 2 * t);
              var i = (y * W + x) * 2; raw[i] = -nx * m; raw[i + 1] = -ny * m;
              maxD = Math.max(maxD, Math.abs(raw[i]), Math.abs(raw[i + 1]));
            }
          }
          maxD = Math.max(maxD, 1e-3);
          for (var j = 0; j < W * H; j++) {
            img.data[j * 4] = Math.round((raw[j * 2] / maxD * 0.5 + 0.5) * 255);
            img.data[j * 4 + 1] = Math.round((raw[j * 2 + 1] / maxD * 0.5 + 0.5) * 255);
            img.data[j * 4 + 2] = 128; img.data[j * 4 + 3] = 255;
          }
          ctx.putImageData(img, 0, 0);
          var map = document.getElementById("lg-map");
          map.setAttribute("width", W); map.setAttribute("height", H);
          map.setAttributeNS("http://www.w3.org/1999/xlink", "href", cv.toDataURL());
          map.setAttribute("href", cv.toDataURL());
          document.getElementById("lg-disp").setAttribute("scale", String(maxD * 2));
          // text
          var text = String(v.text || ""), box = document.getElementById("lg-text");
          box.style.fontSize = Math.round(H * 0.34) + "px";
          if (on("rtl", false)) { box.style.direction = "rtl"; }
          var chars = Array.from(text), typeOn = on("type_on", true), at = Number(v.type_at) || 0.5, cps = Math.max(1, Number(v.cps) || 18);
          var tl = gsap.timeline({ paused: true });
          chars.forEach(function (ch, ci) {
            var c = document.createElement("span"); c.className = "lg-ch"; c.id = "lg-ch-" + ci; c.setAttribute("data-layout-allow-overlap", ""); c.textContent = ch; box.appendChild(c);
            tl.set("#lg-ch-" + ci, { opacity: 1 }, typeOn ? at + ci / cps : 0);
          });
          // enter eased (>= 0.3 s, never a pop), a slow drift of the aura, leave eased
          tl.fromTo(["#lg-glass", "#lg-edge", "#lg-frost"], { opacity: 0, y: 24, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 0);
          if (on("aura", true)) {
            aura.style.top = (TOP + H / 2 - 450) + "px";
            tl.fromTo("#lg-aura", { opacity: 0, x: -40, rotation: -4 }, { opacity: 0.9, x: 40, rotation: 4, duration: D, ease: "sine.inOut" }, 0);
          }
          tl.to(["#lg-glass", "#lg-edge", "#lg-frost"], { opacity: 0, duration: 0.3, ease: "power2.in" }, Math.max(0.5, D - 0.3));
          window.__timelines = window.__timelines || {};
          window.__timelines["liquid-glass"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
