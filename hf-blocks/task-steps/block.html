<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Card title","default":"Today"},
  {"id":"steps","type":"string","label":"Steps: JSON array of strings (Hebrew or English)","default":"[\"Record\",\"Cut\",\"Colour\",\"Publish\"]"},
  {"id":"duration","type":"number","label":"Seconds for the whole card (steps tick off evenly between 0.6 s and the last 0.6 s)","default":4}
]'>
  <head>
    <meta charset="UTF-8" />
    <style>
      /* palette = CSS variables set on the host page: --hfb-card, --hfb-fg, --hfb-muted, --hfb-accent */
      #task-steps { position: absolute; inset: 0; overflow: hidden; font-family: var(--hfb-font, sans-serif); }
      #task-steps .ts-card { position: absolute; left: 50%; top: 50%; width: 860px; transform: translate(-50%, -50%); padding: 56px 56px 40px; border-radius: 44px;
        background: var(--hfb-card, #16181d); color: var(--hfb-fg, #f4f4f5); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45); }
      #task-steps .ts-title { font-size: 54px; font-weight: 700; margin-bottom: 36px; }
      #task-steps .ts-row { display: flex; align-items: center; gap: 28px; padding: 22px 0; border-top: 2px solid rgba(255, 255, 255, 0.08); }
      #task-steps .ts-box { position: relative; flex: none; width: 64px; height: 64px; border-radius: 18px; border: 4px solid var(--hfb-muted, #8b93a1); }
      #task-steps .ts-fill { position: absolute; inset: -4px; border-radius: 18px; background: var(--hfb-accent, #22c55e); opacity: 0; }
      #task-steps .ts-check { position: absolute; left: 12px; top: 14px; width: 40px; height: 36px; }
      #task-steps .ts-check path { fill: none; stroke: #ffffff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; }
      #task-steps .ts-text { font-size: 46px; font-weight: 500; unicode-bidi: plaintext; text-align: start; flex: 1; }
    </style>
  </head>
  <body>
    <div id="task-steps" data-composition-id="task-steps" data-width="1080" data-height="1920">
      <div class="ts-card" id="task-steps-card">
        <div class="ts-title" id="task-steps-title" dir="auto"></div>
        <div id="task-steps-list"></div>
      </div>
      <script>
        (function () {
          var v = window.__hyperframes.getVariables();
          var D = Math.max(1.5, Number(v.duration) || 4);
          var steps;
          try { steps = JSON.parse(v.steps); } catch (e) { steps = ["Record", "Cut", "Colour", "Publish"]; }
          if (!Array.isArray(steps) || !steps.length) steps = ["Step"];
          document.getElementById("task-steps-title").textContent = v.title || "";
          var list = document.getElementById("task-steps-list");
          steps.forEach(function (text, i) {
            var row = document.createElement("div");
            row.className = "ts-row"; row.id = "task-steps-row-" + i;
            row.innerHTML = '<div class="ts-box"><div class="ts-fill" id="task-steps-fill-' + i + '"></div>' +
              '<svg class="ts-check" viewBox="0 0 40 36"><path id="task-steps-tick-' + i + '" d="M4 19 L16 31 L36 5"/></svg></div>' +
              '<div class="ts-text" id="task-steps-text-' + i + '" dir="auto"></div>';
            list.appendChild(row);
            row.querySelector(".ts-text").textContent = String(text);
          });
          // designer curves (cubic-bezier, the motion kit's kit.* values): a curve per move, never a named preset
          var BZ = function (x1, y1, x2, y2) { var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
            return function (p) { if (p <= 0) return 0; if (p >= 1) return 1; var lo = 0, hi = 1, t = p; for (var i = 0; i < 24; i++) { var x = ((ax * t + bx) * t + cx) * t; if (x < p) lo = t; else hi = t; t = (lo + hi) / 2; } return ((ay * t + by) * t + cy) * t; }; };
          var LAND = BZ(0.1, 0.75, 0.15, 1), LEAVE = BZ(0.55, 0, 0.9, 0.35), HEAVY = BZ(0.75, 0, 0.18, 1), DRIFT = BZ(0.4, 0, 0.6, 1), WIND = BZ(0.45, 0, 0.55, 1);
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#task-steps-card", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.5, ease: LAND }, 0);
          var REACT = [0, 4, 9, 15, 22, 30, 39, 49, 60, 72]; // frames at 60 fps: the first row leads, the rest react unevenly
          steps.forEach(function (_, i) {
            tl.fromTo("#task-steps-row-" + i, { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.4, ease: LAND }, 0.15 + (i < REACT.length ? REACT[i] : 72 + (i - 9) * 13) / 60);
          });
          var span = Math.max(0.2, D - 1.2) / steps.length;
          steps.forEach(function (_, i) {
            var t0 = 0.6 + i * span;
            tl.to("#task-steps-fill-" + i, { opacity: 1, duration: 0.18, ease: LAND }, t0);
            tl.to("#task-steps-tick-" + i, { strokeDashoffset: 0, duration: 0.3, ease: HEAVY }, t0 + 0.08);
            tl.to("#task-steps-text-" + i, { opacity: 0.45, duration: 0.3, ease: DRIFT }, t0 + 0.2);
          });
          window.__timelines = window.__timelines || {};
          window.__timelines["task-steps"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
