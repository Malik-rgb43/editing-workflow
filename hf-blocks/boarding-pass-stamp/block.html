<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"from_code","type":"string","label":"Departure code","default":"TLV"},
  {"id":"to_code","type":"string","label":"Arrival code","default":"JFK"},
  {"id":"from_city","type":"string","label":"Departure city","default":"Tel Aviv"},
  {"id":"to_city","type":"string","label":"Arrival city","default":"New York"},
  {"id":"passenger","type":"string","label":"Passenger","default":"A. TRAVELLER"},
  {"id":"flight","type":"string","label":"Flight","default":"LY001"},
  {"id":"gate","type":"string","label":"Gate","default":"B12"},
  {"id":"seat","type":"string","label":"Seat","default":"7A"},
  {"id":"stamp","type":"string","label":"Stamp text (empty = no stamp)","default":"APPROVED"},
  {"id":"stamp_at","type":"number","label":"Second the stamp lands","default":1.6},
  {"id":"duration","type":"number","label":"Seconds the card is on screen","default":3.5}
]'>
  <head>
    <meta charset="UTF-8" />
    <style>
      /* palette = CSS variables set on the host page: --hfb-card, --hfb-fg, --hfb-muted, --hfb-accent, --hfb-stamp */
      #boarding-pass-stamp { position: absolute; inset: 0; overflow: hidden; font-family: var(--hfb-font, sans-serif); }
      #boarding-pass-stamp .bp-card { position: absolute; left: 50%; top: 50%; width: 900px; height: 520px; margin: -260px 0 0 -450px; border-radius: 36px; overflow: hidden;
        background: var(--hfb-card, #f6f1e7); color: #14161a; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5); }
      #boarding-pass-stamp .bp-head { height: 84px; background: var(--hfb-accent, #1e40af); color: #ffffff; display: flex; align-items: center; justify-content: space-between; padding: 0 44px; font-size: 34px; font-weight: 700; letter-spacing: 6px; }
      #boarding-pass-stamp .bp-route { display: flex; align-items: center; justify-content: space-between; padding: 36px 52px 12px; }
      #boarding-pass-stamp .bp-code { font-size: 118px; font-weight: 800; line-height: 1; }
      #boarding-pass-stamp .bp-city { font-size: 28px; color: #3f4551; margin-top: 8px; unicode-bidi: plaintext; }
      #boarding-pass-stamp .bp-plane { font-size: 64px; color: var(--hfb-accent, #1e40af); }
      #boarding-pass-stamp .bp-meta { display: flex; gap: 56px; padding: 22px 52px 0; }
      #boarding-pass-stamp .bp-label { font-size: 22px; color: #3f4551; letter-spacing: 3px; }
      #boarding-pass-stamp .bp-value { font-size: 40px; font-weight: 700; unicode-bidi: plaintext; }
      #boarding-pass-stamp .bp-bars { position: absolute; left: 52px; right: 52px; bottom: 34px; height: 64px;
        background: repeating-linear-gradient(90deg, #14161a 0 4px, transparent 4px 9px, #14161a 9px 11px, transparent 11px 18px, #14161a 18px 24px, transparent 24px 28px); }
      #boarding-pass-stamp .bp-cut { position: absolute; left: 0; right: 0; top: 84px; height: 0; border-top: 4px dashed rgba(0, 0, 0, 0.18); }
      #boarding-pass-stamp .bp-stamp { position: absolute; left: 50%; top: 50%; margin: -70px 0 0 -300px; width: 600px; height: 140px; border: 12px solid var(--hfb-stamp, #dc2626); border-radius: 22px;
        color: var(--hfb-stamp, #dc2626); display: flex; align-items: center; justify-content: center; font-size: 72px; font-weight: 900; letter-spacing: 6px; transform: rotate(-14deg); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="boarding-pass-stamp" data-composition-id="boarding-pass-stamp" data-width="1080" data-height="1920">
      <div class="bp-card" id="boarding-pass-card">
        <div class="bp-head"><span>BOARDING PASS</span><span id="boarding-pass-flight"></span></div>
        <div class="bp-route">
          <div><div class="bp-code" id="boarding-pass-from"></div><div class="bp-city" id="boarding-pass-from-city" dir="auto"></div></div>
          <div class="bp-plane">&#9992;</div>
          <div style="text-align:end"><div class="bp-code" id="boarding-pass-to"></div><div class="bp-city" id="boarding-pass-to-city" dir="auto"></div></div>
        </div>
        <div class="bp-meta">
          <div><div class="bp-label">PASSENGER</div><div class="bp-value" id="boarding-pass-passenger" dir="auto"></div></div>
          <div><div class="bp-label">GATE</div><div class="bp-value" id="boarding-pass-gate"></div></div>
          <div><div class="bp-label">SEAT</div><div class="bp-value" id="boarding-pass-seat"></div></div>
        </div>
        <div class="bp-cut"></div>
        <div class="bp-bars"></div>
        <div class="bp-stamp" id="boarding-pass-stamp-mark" dir="auto" data-layout-allow-overlap></div>
      </div>
      <script>
        (function () {
          var v = window.__hyperframes.getVariables();
          function set(id, text) { document.getElementById(id).textContent = text == null ? "" : String(text); }
          set("boarding-pass-from", v.from_code); set("boarding-pass-to", v.to_code);
          set("boarding-pass-from-city", v.from_city); set("boarding-pass-to-city", v.to_city);
          set("boarding-pass-passenger", v.passenger); set("boarding-pass-flight", v.flight);
          set("boarding-pass-gate", v.gate); set("boarding-pass-seat", v.seat); set("boarding-pass-stamp-mark", v.stamp);
          var D = Math.max(1, Number(v.duration) || 3.5);
          var at = Math.min(D - 0.5, Math.max(0.6, Number(v.stamp_at) || 1.6));
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#boarding-pass-card", { y: 160, rotation: -4, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0);
          if (v.stamp) { // the stamp slams: big and transparent to full size, then the card shakes once
            tl.fromTo("#boarding-pass-stamp-mark", { scale: 2.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.14, ease: "power4.in" }, at);
            tl.fromTo("#boarding-pass-card", { x: 0 }, { x: -14, duration: 0.05, ease: "none" }, at + 0.14);
            tl.to("#boarding-pass-card", { x: 10, duration: 0.06, ease: "none" }, at + 0.19);
            tl.to("#boarding-pass-card", { x: 0, duration: 0.08, ease: "power2.out" }, at + 0.25);
          }
          window.__timelines = window.__timelines || {};
          window.__timelines["boarding-pass-stamp"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
