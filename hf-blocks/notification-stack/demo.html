<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0a; }
    </style>
  </head>
  <body>
    <div id="demo-root" data-composition-id="demo" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div id="demo-bg" style="position:absolute;inset:0;background:linear-gradient(160deg,#1f2937,#0b1220)"></div>
      <div id="demo-notification-stack" class="clip" data-composition-id="notification-stack-host" data-composition-src="compositions/notification-stack.html" data-start="0" data-duration="4" data-track-index="0"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["demo"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
