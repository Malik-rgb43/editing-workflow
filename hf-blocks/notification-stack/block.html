<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"items","type":"string","label":"Notifications, oldest first: JSON array of {app, title, body}","default":"[{\"app\":\"Messages\",\"title\":\"Dana\",\"body\":\"Are you coming tonight?\"},{\"app\":\"Mail\",\"title\":\"Invoice paid\",\"body\":\"The payment arrived.\"},{\"app\":\"Calendar\",\"title\":\"In 10 minutes\",\"body\":\"Client call\"}]"},
  {"id":"gap_s","type":"number","label":"Seconds between two notifications arriving","default":0.9},
  {"id":"duration","type":"number","label":"Seconds the stack is on screen","default":4}
]'>
  <head>
    <meta charset="UTF-8" />
    <style>
      /* palette = CSS variables set on the host page: --hfb-card, --hfb-fg, --hfb-muted, --hfb-accent. New notifications enter on TOP and push the older ones down. */
      #notification-stack { position: absolute; inset: 0; overflow: hidden; font-family: var(--hfb-font, sans-serif); }
      #notification-stack .ns-item { position: absolute; left: 50%; top: 260px; width: 940px; margin-left: -470px; height: 168px; border-radius: 40px; padding: 26px 34px;
        background: var(--hfb-card, rgba(40, 42, 48, 0.94)); color: var(--hfb-fg, #f4f4f5); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4); opacity: 0; }
      #notification-stack .ns-top { display: flex; align-items: center; gap: 16px; font-size: 26px; color: var(--hfb-muted, #9aa1ad); text-transform: uppercase; letter-spacing: 2px; }
      #notification-stack .ns-dot { width: 34px; height: 34px; border-radius: 9px; background: var(--hfb-accent, #34d399); }
      #notification-stack .ns-title { font-size: 40px; font-weight: 700; margin-top: 10px; unicode-bidi: plaintext; }
      #notification-stack .ns-body { font-size: 34px; color: var(--hfb-muted, #c3c8d1); margin-top: 2px; unicode-bidi: plaintext; }
    </style>
  </head>
  <body>
    <div id="notification-stack" data-composition-id="notification-stack" data-width="1080" data-height="1920">
      <div id="notification-stack-list"></div>
      <script>
        (function () {
          var v = window.__hyperframes.getVariables();
          var items;
          try { items = JSON.parse(v.items); } catch (e) { items = []; }
          if (!Array.isArray(items) || !items.length) items = [{ app: "App", title: "Title", body: "Message" }];
          var gap = Math.max(0.2, Number(v.gap_s) || 0.9);
          var STEP = 196; // card height 168 + 28 px gap
          var list = document.getElementById("notification-stack-list");
          items.forEach(function (it, i) {
            var el = document.createElement("div");
            el.className = "ns-item"; el.id = "notification-stack-item-" + i;
            el.innerHTML = '<div class="ns-top"><div class="ns-dot"></div><span class="ns-app" dir="auto"></span></div><div class="ns-title" dir="auto"></div><div class="ns-body" dir="auto"></div>';
            el.querySelector(".ns-app").textContent = String(it.app || "");
            el.querySelector(".ns-title").textContent = String(it.title || "");
            el.querySelector(".ns-body").textContent = String(it.body || "");
            list.appendChild(el);
          });
          var tl = gsap.timeline({ paused: true });
          items.forEach(function (_, i) {
            var t0 = 0.2 + i * gap;
            tl.fromTo("#notification-stack-item-" + i, { y: -STEP, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, t0);
            for (var j = 0; j < i; j++) { // every older card slides down one slot when this one arrives
              tl.to("#notification-stack-item-" + j, { y: (i - j) * STEP, opacity: Math.max(0.35, 1 - (i - j) * 0.22), duration: 0.5, ease: "power3.out" }, t0);
            }
          });
          window.__timelines = window.__timelines || {};
          window.__timelines["notification-stack"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
