<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"peak","type":"number","label":"Second of the burn peak inside this block: put it on the cut frame","default":0.5},
  {"id":"duration","type":"number","label":"Seconds the burn lasts (rise + fall)","default":1.0},
  {"id":"intensity","type":"number","label":"0..1 strength of the washout at the peak","default":0.9}
]'>
  <head>
    <meta charset="UTF-8" />
    <style>
      /* a PROCEDURAL light-leak / film-burn overlay (no stock clip): screen-blended warm gradients that bloom to a near-white washout at the peak.
         Put it on a track ABOVE the two shots and set `peak` to the cut time; if you use your own burn clip instead, retime its 24p frames to the cut frame (see README).
         palette = CSS variables on the host page: --hfb-burn-1 (hot), --hfb-burn-2 (warm), --hfb-burn-3 (deep) */
      #film-burn { position: absolute; inset: 0; overflow: hidden; background: transparent; }
      #film-burn .fb-layer { position: absolute; inset: -20%; mix-blend-mode: screen; opacity: 0; }
      #film-burn .fb-a { background: radial-gradient(ellipse 55% 45% at 30% 35%, var(--hfb-burn-1, #ffd27a) 0%, var(--hfb-burn-2, #ff7a2f) 38%, rgba(255, 60, 0, 0) 72%); }
      #film-burn .fb-b { background: radial-gradient(ellipse 60% 50% at 75% 70%, var(--hfb-burn-2, #ff7a2f) 0%, var(--hfb-burn-3, #b3171f) 45%, rgba(120, 0, 20, 0) 75%); }
      #film-burn .fb-c { background: linear-gradient(115deg, rgba(255, 220, 160, 0) 20%, var(--hfb-burn-1, #ffd27a) 50%, rgba(255, 220, 160, 0) 80%); }
      #film-burn .fb-wash { position: absolute; inset: 0; background: #fff3dc; mix-blend-mode: screen; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="film-burn" data-composition-id="film-burn" data-width="1080" data-height="1920">
      <div class="fb-layer fb-a" id="film-burn-a"></div>
      <div class="fb-layer fb-b" id="film-burn-b"></div>
      <div class="fb-layer fb-c" id="film-burn-c"></div>
      <div class="fb-wash" id="film-burn-wash"></div>
      <script>
        (function () {
          var v = window.__hyperframes.getVariables();
          var D = Math.max(0.3, Number(v.duration) || 1.0);
          var peak = Math.min(D - 0.05, Math.max(0.1, Number(v.peak) || D / 2));
          var k = Math.min(1, Math.max(0.1, Number(v.intensity) || 0.9));
          // designer curves (cubic-bezier, the motion kit's kit.* values): a curve per move, never a named preset
          var BZ = function (x1, y1, x2, y2) { var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
            return function (p) { if (p <= 0) return 0; if (p >= 1) return 1; var lo = 0, hi = 1, t = p; for (var i = 0; i < 24; i++) { var x = ((ax * t + bx) * t + cx) * t; if (x < p) lo = t; else hi = t; t = (lo + hi) / 2; } return ((ay * t + by) * t + cy) * t; }; };
          var LAND = BZ(0.1, 0.75, 0.15, 1), LEAVE = BZ(0.55, 0, 0.9, 0.35), HEAVY = BZ(0.75, 0, 0.18, 1), DRIFT = BZ(0.4, 0, 0.6, 1), WIND = BZ(0.45, 0, 0.55, 1);
          var tl = gsap.timeline({ paused: true });
          // layers rise to the peak with an accelerating curve, fall away slower (a burn builds fast and cools slowly); positions drift so it never looks like a flat fade
          tl.fromTo("#film-burn-a", { opacity: 0, x: "-18%", y: "6%", scale: 0.9 }, { opacity: 0.95 * k, x: "0%", y: "0%", scale: 1.05, duration: peak, ease: LEAVE }, 0);
          tl.to("#film-burn-a", { opacity: 0, x: "12%", y: "-8%", scale: 1.2, duration: D - peak, ease: LAND }, peak);
          tl.fromTo("#film-burn-b", { opacity: 0, x: "20%", y: "-10%", scale: 0.95 }, { opacity: 0.9 * k, x: "0%", y: "0%", scale: 1.1, duration: peak * 0.9, ease: LEAVE }, peak * 0.1);
          tl.to("#film-burn-b", { opacity: 0, x: "-14%", y: "10%", scale: 1.25, duration: D - peak, ease: LAND }, peak);
          tl.fromTo("#film-burn-c", { opacity: 0, x: "-40%" }, { opacity: 0.8 * k, x: "0%", duration: peak, ease: LEAVE }, 0);
          tl.to("#film-burn-c", { opacity: 0, x: "40%", duration: D - peak, ease: LAND }, peak);
          tl.fromTo("#film-burn-wash", { opacity: 0 }, { opacity: 0.85 * k, duration: Math.max(0.05, peak * 0.35), ease: LEAVE }, peak - Math.max(0.05, peak * 0.35));
          tl.to("#film-burn-wash", { opacity: 0, duration: Math.min(D - peak, 0.35), ease: LAND }, peak);
          window.__timelines = window.__timelines || {};
          window.__timelines["film-burn"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
