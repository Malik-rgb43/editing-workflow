<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"levels","type":"string","label":"Voice levels: JSON array of 0..1 values, 30 per second (tools/hf_blocks.py levels). Empty = a built-in demo envelope","default":""},
  {"id":"size","type":"number","label":"Orb diameter in px","default":420},
  {"id":"duration","type":"number","label":"Seconds the orb is animated","default":3}
]'>
  <head>
    <meta charset="UTF-8" />
    <style>
      /* palette = CSS variables: set --hfb-* on the host page to re-theme (palette_audit.py passes after re-theming) */
      #voice-orb { --hfb-orb-core: var(--hfb-accent, #7c5cff); --hfb-orb-glow: var(--hfb-accent-2, #38bdf8); position: absolute; inset: 0; overflow: hidden; }
      #voice-orb .vo-stage { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
      #voice-orb .vo-ring { position: absolute; border-radius: 50%; left: 0; top: 0; transform: translate(-50%, -50%); border: 3px solid var(--hfb-orb-glow); opacity: 0; }
      #voice-orb .vo-core { position: absolute; border-radius: 50%; left: 0; top: 0; transform: translate(-50%, -50%);
        background: radial-gradient(circle at 35% 30%, #ffffff 0%, var(--hfb-orb-glow) 28%, var(--hfb-orb-core) 70%, #1b1240 100%); box-shadow: 0 0 80px 10px var(--hfb-orb-core); }
    </style>
  </head>
  <body>
    <div id="voice-orb" data-composition-id="voice-orb" data-width="1080" data-height="1920">
      <div class="vo-stage">
        <div class="vo-ring" id="voice-orb-ring-1"></div>
        <div class="vo-ring" id="voice-orb-ring-2"></div>
        <div class="vo-core" id="voice-orb-core"></div>
      </div>
      <script>
        (function () {
          var v = window.__hyperframes.getVariables();
          var D = Math.max(0.1, Number(v.duration) || 3);
          var size = Number(v.size) || 420;
          var levels = [];
          try { levels = JSON.parse(v.levels || "[]"); } catch (e) { levels = []; }
          if (!levels.length) { // demo envelope: a pure function of the frame index, no clock and no random
            for (var i = 0; i < Math.ceil(D * 30) + 1; i++) {
              levels.push(Math.min(1, Math.max(0, 0.45 + 0.30 * Math.sin(i * 0.37) + 0.20 * Math.sin(i * 0.91 + 1.3) * Math.sin(i * 0.11))));
            }
          }
          var core = document.getElementById("voice-orb-core");
          var rings = [document.getElementById("voice-orb-ring-1"), document.getElementById("voice-orb-ring-2")];
          function level(t) { // linear interpolation between the 30 fps samples
            var f = t * 30, a = Math.floor(f), k = f - a;
            var l0 = levels[Math.min(levels.length - 1, Math.max(0, a))], l1 = levels[Math.min(levels.length - 1, Math.max(0, a + 1))];
            return l0 + (l1 - l0) * k;
          }
          function draw(t) { // pure function of time: safe to seek anywhere
            var l = level(t);
            var d = size * (0.78 + 0.34 * l);
            core.style.width = d + "px"; core.style.height = d + "px";
            core.style.boxShadow = "0 0 " + (50 + 120 * l) + "px " + (6 + 26 * l) + "px var(--hfb-orb-core)";
            for (var r = 0; r < rings.length; r++) {
              var ph = ((t * 0.9) + r * 0.5) % 1; // each ring expands once per 1.1 s
              var rd = d * (1.0 + 0.9 * ph);
              rings[r].style.width = rd + "px"; rings[r].style.height = rd + "px";
              rings[r].style.opacity = String((1 - ph) * (0.15 + 0.6 * l));
            }
          }
          var state = { t: 0 };
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#voice-orb .vo-stage", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0);
          tl.to(state, { t: D, duration: D, ease: "none", onUpdate: function () { draw(state.t); } }, 0);
          draw(0);
          window.__timelines = window.__timelines || {};
          window.__timelines["voice-orb"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
