schema = "avc-profile/1"
id = "asr-vulkan"
title = "Hebrew ASR on a Vulkan GPU (whisper.cpp, GGML)"
status = "optional"
evidence_state = "measured"            # measured on ONE AMD GPU only; other GPUs unmeasured
checked_at = "2026-10-02"
expires = "2026-12-31"

[install]
python_extras = ["asr-vulkan"]         # wrapper-side Python dependencies; contents defined by the pyproject owner
native_binary = "whisper-cli built from whisper.cpp source with -DGGML_VULKAN=ON (or a Vulkan-enabled binary obtained by the student)"
build_prerequisites = ["CMake (4.3.1 measured)", "Vulkan SDK (1.4.357.0 measured)", "Visual Studio 2022 C++ toolchain, x64 (Windows)"]
whisper_cpp_pin = "b5130, commit 927cfce34f31707e17f2bff35c349632fb9e2c3a (measured); a newer head 6e4ab854f67f743900934a703d5603419384c961 is a different, untested candidate"
env = { GGML_VK_DISABLE_COOPMAT = "1" }   # required on the reference GPU's; LOCAL-only, set by doctor
python_env = "separate from asr-cpu / matte environments"
needs_account = false
needs_api_key = false
spends_money = false

[[install.models]]
name = "ivrit-ai/whisper-large-v3-turbo-ggml"
revision = "2130c78e4a9cb4914cc4df91a1c3031407789705"
bytes = 1624555275
sha256_prefix = "c8090411"
licence = "Apache-2.0 (exact checkpoint)"
source = "huggingface model card; research T08-S003; E08 report"

[download_sizes]
model = "1,624,555,275 B (sourced)"
whisper_cpp_source_zip = "10,476,278 B (sourced, E08)"
build_toolchain = "unmeasured (CMake, Vulkan SDK, Visual Studio installs)"
build_time_measured = "configure 33.477 s + compile 248.464 s on the reference machine"
source = "distilled/06-hebrew-footage-reference/asr-and-transcription.md sections 1 and 2"

[hardware]
gpu = "a Vulkan-capable GPU; measured only on the reference machine (hardware details not published)"
ram = "measured on the reference machine; whisper-cli sampled process memory 0.19 GB (excludes GPU memory)"
peak_vram = "unmeasured"
power_thermals = "unmeasured"

[tested_on]
state = "measured"
machine = "the reference machine (one Windows laptop; hardware details not published)"
e08 = "68 FLEURS he_il clips, 614.22 s: Vulkan 8 threads 105.604 s whole-wrapper = 5.816 audio-s per wall-s, 212/1161 word edits (WER 18.260%); the same build on CPU 8 threads 1033.045 s (9.78x slower; launch-to-finalisation 10.0x)"
threads = "Vulkan 4/8/16 threads: 104.884 / 105.604 / 106.258 s, byte-identical transcripts - no thread winner"
conflict = "an earlier owner note measured only 2.4x on a loaded machine; quote E08 with its scope and re-measure on the student's hardware"
not_tested = ["NVIDIA GPUs via Vulkan", "Intel GPUs", "Linux", "macOS", "peak VRAM", "thermals", "long recordings", "spontaneous speech"]
official_windows_release = "the official Windows b5130 release asset has only CPU/BLAS variants (no Vulkan): the student builds from source or uses another binary source"

[states]
unsupported_when = ["no Vulkan-capable GPU/driver found by a real device probe", "operating system without a build recipe"]
missing_when = ["whisper-cli (Vulkan build) not found", "model revision not present or hash mismatch", "extra asr-vulkan not installed"]
error_when = ["whisper-cli starts and crashes, reports no Vulkan device, or fails the tiny Hebrew fixture (check GGML_VK_DISABLE_COOPMAT=1 first)"]
note = "unsupported != missing != error; on error never fall back silently to a paid route - fall back to asr-cpu and say so"

[licences]
runtime = "whisper.cpp MIT"
weights = "Apache-2.0 declared on the exact ivrit-ai GGML checkpoint"
rights_note = "ONNX conversions of the same model are unresolved and not part of this profile"

[uninstall]
remove = ["the build directory and whisper-cli", "the model cache (about 1.6 GB)", "the asr-vulkan Python environment"]
leave_alone = "CMake, the Vulkan SDK and Visual Studio were installed by the student, not by the toolkit - the toolkit does not uninstall them and never installed them silently"
global_changes = "none by the toolkit"
