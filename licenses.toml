# licenses.toml - declared licence and origin for every file that ships. Read by scripts/gen_bom.py.
#
# Fail-closed by design:
#   * a file that no rule covers is "unknown" and FAILS the BOM gate;
#   * video / audio / image / font / weights / archive / executable files are only covered by a rule that
#     lists that class in `allow = [...]` - so a media file dropped into a text-only folder is never
#     silently claimed as owner-authored;
#   * the LAST matching rule wins; globs use ** for any depth.
#
# `licence = "Apache-2.0"` is the decision default Q12: the owner has not chosen a licence for
# owner-authored code and content, the repository stays private until that decision. This file does NOT
# pick a licence. Third-party material needs origin = "third_party", a `source`, and (once a register is
# supplied to gen_bom) a `register_id` whose row is cleared. Nothing third-party is bundled today.

schema = 1

# ---- owner-authored text and code at the repository root -------------------------------------------
[[rule]]
globs = ["*.md", "*.toml", "*.json", "*.jsonl", "*.yml", "*.yaml", "*.txt", "*.py", "*.js", "*.sh", "*.ps1", "*.cmd", "*.bat", "*.html", "*.css", "*.csv", "*.cfg", "*.ini",
         "*.example", ".gitignore", ".gitattributes", ".editorconfig", "LICENSE", "NOTICE"]
origin = "owner"
licence = "Apache-2.0"
note = "root-level owner-authored text/code (Q12: licence undecided)"

# ---- owner-authored folders (text and code only unless a later rule allows more) --------------------
[[rule]]
globs = [
  "agent-content/**", "contracts/**", "src/**", "tools/**", "profiles/**", "scripts/**", "tests/**",
  "packaging/**", "fixtures/**", "install/**", "integrations/**", ".github/**", "docs/**", "templates/**",
  ".claude/**", ".codex/**", ".agents/**",
]
origin = "owner"
licence = "Apache-2.0"
note = "owner-authored repository content (Q12: licence undecided)"

# ---- images are allowed only where the owner authors diagrams or synthetic template art -------------
[[rule]]
globs = ["docs/**", "templates/**"]
origin = "owner"
licence = "Apache-2.0"
allow = ["image"]
note = "owner-authored diagrams / synthetic template art only; every image must be owner-made or generated by fixtures/generators"

# ---- generated host copies of agent-content/skills (see scripts/build_agent_adapters.py) --------------
[[rule]]
globs = [".claude/skills/**", ".agents/skills/**"]
origin = "generated"
licence = "Apache-2.0"
note = "byte-identical generated copies; the canonical source is agent-content/skills"

# ---- machine-generated lock files (they describe dependencies; they do not bundle them) ----------------
[[rule]]
globs = ["uv.lock", "package-lock.json", "pnpm-lock.yaml", "yarn.lock", "**/package-lock.json"]
origin = "generated"
licence = "generated-lockfile"
note = "dependency lock file; dependency licences are reviewed separately via THIRD_PARTY_NOTICES.md"

# ---- generated BOM output ----------------------------------------------------------------------------
[[rule]]
globs = ["docs/BOM.json", "docs/BOM.md", "docs/TOOLS.md", "SYSTEM.md"]
origin = "generated"
licence = "Apache-2.0"
note = "generated by scripts/gen_bom.py, gen_tools_md.py, gen_system_md.py"
